services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports: ["127.0.0.1:8000:8000"]
    environment:
      CLOUDLAKE_DATABASE_URL: ${CLOUDLAKE_COMPOSE_DB_URL:-sqlite:////data/metadata.db}
    volumes: ["lake:/data"]
  web:
    build: ./frontend
    ports: ["127.0.0.1:5173:80"]
    depends_on: [api]
  postgres:
    image: postgres:16.9-alpine
    profiles: [infrastructure]
    environment:
      POSTGRES_USER: cloudlake
      POSTGRES_DB: cloudlake
      POSTGRES_PASSWORD: ${CLOUDLAKE_POSTGRES_PASSWORD:-}
    volumes: ["pg:/var/lib/postgresql/data"]
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: [infrastructure]
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${CLOUDLAKE_MINIO_USER:-}
      MINIO_ROOT_PASSWORD: ${CLOUDLAKE_MINIO_PASSWORD:-}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["objects:/data"]
volumes:
  lake:
  pg:
  objects:
